server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Use Docker's internal DNS resolver so the 'backend' hostname is re-resolved
    # on every upstream connection rather than cached at nginx startup.
    # This prevents stale-IP 502 errors when the backend container is recreated
    # and gets a new IP address.
    # 127.0.0.11 is the Docker embedded DNS server address (fixed for all containers).
    resolver 127.0.0.11 valid=5s;
    set $backend_upstream http://backend:8000;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass $backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Generous timeouts for LLM-backed endpoints (analysis can take 30s+).
        proxy_read_timeout 120s;
        proxy_connect_timeout 10s;
        proxy_send_timeout 30s;
    }
}
